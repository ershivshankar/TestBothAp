<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline';">
<title>Control</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d0d0d;color:#eee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;height:100vh;display:flex;flex-direction:column}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;background:#141414;border-bottom:1px solid #222}
  header h1{font-size:18px;font-weight:600;letter-spacing:.5px}
  .status-dot{width:10px;height:10px;border-radius:50%;background:#555;transition:background .3s}
  .status-dot.online{background:#00cc44}
  .status-bar{display:flex;align-items:center;gap:8px;font-size:12px;color:#888}
  .search-bar{padding:10px 20px;background:#111;border-bottom:1px solid #1e1e1e}
  .search-bar input{width:100%;padding:8px 14px;background:#1a1a1a;border:1px solid #2a2a2a;border-radius:20px;color:#eee;font-size:13px;outline:none}
  .search-bar input:focus{border-color:#2979ff}
  .content{flex:1;overflow-y:auto;padding:16px 20px}
  .section-header{display:flex;align-items:center;gap:10px;margin:12px 0 8px;font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:1px}
  .badge{background:#1e1e1e;color:#aaa;font-size:11px;padding:2px 8px;border-radius:10px}
  .device-card{display:flex;align-items:center;gap:14px;padding:14px 16px;background:#161616;border:1px solid #222;border-radius:12px;margin-bottom:8px;cursor:pointer;transition:background .15s,border-color .15s}
  .device-card:hover{background:#1e1e1e;border-color:#2979ff44}
  .device-card.offline{cursor:default;opacity:.65}
  .avatar{width:44px;height:44px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:700;flex-shrink:0}
  .avatar.online{background:#1a3d2b;color:#00cc44}
  .avatar.offline{background:#2a2a2a;color:#888}
  .device-info{flex:1;min-width:0}
  .device-name{font-size:14px;font-weight:600;margin-bottom:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .device-meta{font-size:12px;color:#888}
  .status-chip{font-size:11px;font-weight:600;padding:3px 10px;border-radius:10px;flex-shrink:0}
  .status-chip.online{background:#0a2e1a;color:#00cc44;border:1px solid #00cc4433}
  .status-chip.offline{background:#1e1e1e;color:#666;border:1px solid #333}
  .empty{text-align:center;padding:30px;color:#555;font-size:13px}
  ::-webkit-scrollbar{width:5px}::-webkit-scrollbar-track{background:#111}::-webkit-scrollbar-thumb{background:#2a2a2a;border-radius:3px}
</style>
</head>
<body>
<header>
  <h1>⚡ Control</h1>
  <div class="status-bar">
    <div class="status-dot" id="dot"></div>
    <span id="status-text">Connecting…</span>
  </div>
</header>
<div class="search-bar">
  <input type="text" id="search" placeholder="Search devices…"/>
</div>
<div class="content" id="content">
  <div class="empty">Connecting to relay…</div>
</div>

<script>
let allDevices = [];
let searchQuery = '';

function timeSince(ts) {
  if (!ts) return 'Never';
  const s = Math.floor((Date.now() - ts) / 1000);
  if (s < 60) return `${s}s ago`;
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  return `${Math.floor(s/3600)}h ago`;
}

function durationSince(ts) {
  if (!ts) return '';
  const s = Math.floor((Date.now() - ts) / 1000);
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = s%60;
  return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function renderDevices() {
  const q = searchQuery.toLowerCase();
  const filtered = allDevices.filter(d =>
    !q || d.deviceName?.toLowerCase().includes(q) || d.model?.toLowerCase().includes(q)
  );
  const online = filtered.filter(d => d.online);
  const offline = filtered.filter(d => !d.online);
  const c = document.getElementById('content');

  if (filtered.length === 0) {
    c.innerHTML = '<div class="empty">No devices found</div>';
    return;
  }

  let html = '';

  html += `<div class="section-header">🟢 Online Devices <span class="badge">${online.length}</span></div>`;
  if (online.length === 0) {
    html += '<div class="empty">No online devices</div>';
  } else {
    online.forEach(d => {
      const letter = (d.deviceName || d.model || '?')[0].toUpperCase();
      html += `<div class="device-card" onclick="openDevice('${d.deviceId}','${d.deviceName || d.model}')">
        <div class="avatar online">${letter}</div>
        <div class="device-info">
          <div class="device-name">${d.deviceName || 'Unknown'}</div>
          <div class="device-meta">${d.model || ''} • Android ${d.androidVersion || '?'} • ${durationSince(d.connectedSince)}</div>
        </div>
        <span class="status-chip online">Online</span>
      </div>`;
    });
  }

  html += `<div class="section-header" style="margin-top:16px">⚫ Offline Devices <span class="badge">${offline.length}</span></div>`;
  if (offline.length === 0) {
    html += '<div class="empty">No offline devices</div>';
  } else {
    offline.forEach(d => {
      const letter = (d.deviceName || d.model || '?')[0].toUpperCase();
      html += `<div class="device-card offline">
        <div class="avatar offline">${letter}</div>
        <div class="device-info">
          <div class="device-name">${d.deviceName || 'Unknown'}</div>
          <div class="device-meta">${d.model || ''} • Last seen ${timeSince(d.lastSeen)}</div>
        </div>
        <span class="status-chip offline">Offline</span>
      </div>`;
    });
  }

  c.innerHTML = html;
}

function openDevice(deviceId, deviceName) {
  window.ctrl.subscribeDevice(deviceId, deviceName);
}

window.ctrl.onDeviceList(devices => {
  allDevices = devices;
  renderDevices();
});

window.ctrl.onDeviceInfo(device => {
  const idx = allDevices.findIndex(d => d.deviceId === device.deviceId);
  if (idx >= 0) allDevices[idx] = device; else allDevices.push(device);
  renderDevices();
});

window.ctrl.onWsStatus(({ connected }) => {
  document.getElementById('dot').className = 'status-dot' + (connected ? ' online' : '');
  document.getElementById('status-text').textContent = connected ? 'Connected' : 'Reconnecting…';
  if (connected) window.ctrl.requestDeviceList();
});

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  renderDevices();
});

// Auto-refresh duration display
setInterval(renderDevices, 1000);
window.ctrl.requestDeviceList();
</script>
</body>
</html>
